<article class="simulation-card flex h-full flex-col rounded-lg border border-slate-200 bg-slate-50/70 p-5 transition hover:border-slate-300 hover:bg-white hover:shadow-sm">
    <header class="mb-5">
        <div class="mb-3 flex items-center justify-between gap-3">
            <span class="text-xs font-semibold uppercase tracking-[0.14em] text-slate-400">Climate</span>
            <span class="rounded-full border border-slate-200 bg-white px-2 py-1 text-[11px] font-semibold text-slate-500">Seasonality</span>
        </div>
        <h3 class="text-lg font-semibold text-slate-800">Planetary Seasonality</h3>
        <p class="mt-2 text-sm leading-6 text-slate-600">
            Estimate orbital temperature variation between a planet's closest and farthest stellar distances.
        </p>
    </header>

    <form class="simulation-form flex flex-1 flex-col"
          data-api-endpoint="/simulations/seasonal-temps/"
          data-csrf-token="{{ csrf_token }}"
          data-sim-type="season">
        <div>
            <label for="season-planet-select" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">Planet</label>
            <select id="season-planet-select" name="planet_id"
                    class="mt-2 block w-full rounded-md border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-200">
                {% for planet in seasonality_sim_planets %}
                    <option value="{{ planet.pk }}">{{ planet.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mt-auto pt-6">
            <button type="submit"
                    class="w-full rounded-md bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-black focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                Run Seasonality Simulation
            </button>
        </div>
    </form>
</article>
