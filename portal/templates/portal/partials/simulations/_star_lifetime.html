<article class="simulation-card" data-simulation="star-lifetime">
    <header class="simulation-card__header">
        <p class="simulation-card__category">Stellar Evolution</p>
        <h3 class="text-base sm:text-lg font-semibold text-slate-600">Star Lifetime Simulator</h3>
        <p class="simulation-card__description text-sm text-gray-600">
            Estimate a star's total and remaining main-sequence lifetime from its observed properties.
        </p>
    </header>

    <form class="simulation-form simulation-card__form"
          data-api-endpoint="/simulations/star-lifetime/"
          data-csrf-token="{{ csrf_token }}"
          data-sim-type="lifetime">
        <div class="simulation-card__controls grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
            <div class="sm:col-span-2">
                <label for="lifetime-star-select" class="block text-sm font-medium text-gray-700">Select Star</label>
                <select id="lifetime-star-select" name="star_id"
                        class="mt-1 block w-full pl-3 pr-10 py-3 text-base border-gray-200 focus:outline-none focus:ring-black focus:border-black sm:text-sm rounded-md">
                    {% for star in star_lifetime_sim_stars %}
                        <option value="{{ star.pk }}">{{ star.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <footer class="simulation-card__actions mt-4">
            <button type="submit"
                    class="w-full px-6 py-3 font-semibold text-white bg-gray-900 rounded-md hover:bg-black disabled:opacity-50 disabled:cursor-not-allowed">
                Run Star Lifetime Sim
            </button>
        </footer>
    </form>
</article>
