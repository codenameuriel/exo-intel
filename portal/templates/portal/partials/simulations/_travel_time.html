<article class="simulation-card group flex h-full flex-col rounded-lg border border-slate-200 bg-slate-50/70 p-5 transition duration-200 hover:-translate-y-0.5 hover:border-slate-300 hover:bg-white hover:shadow-sm motion-reduce:transform-none">
    <header class="mb-5">
        <div class="mb-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <span class="flex h-8 w-8 items-center justify-center rounded-md border border-cyan-300/15 bg-cyan-300/[0.04] text-cyan-200 transition duration-200 group-hover:border-cyan-300/30 group-hover:bg-cyan-300/[0.08] motion-reduce:transition-none" aria-hidden="true">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 19 19 5M9 5h10v10"/><path d="M5 9v10h10" opacity=".5"/></svg>
                </span>
                <span class="text-xs font-semibold uppercase tracking-[0.14em] text-slate-400">Trajectory</span>
            </div>
            <span class="rounded-full border border-slate-200 bg-white px-2 py-1 text-[11px] font-semibold text-slate-500">Travel</span>
        </div>
        <h3 class="text-lg font-semibold text-slate-800">Travel Time Calculator</h3>
        <p class="mt-2 text-sm leading-6 text-slate-600">Estimate travel time to a known star system at a selected percentage of light speed.</p>
    </header>

    <form class="simulation-form flex flex-1 flex-col" data-api-endpoint="/simulations/travel-time/" data-csrf-token="{{ csrf_token }}" data-sim-type="travel">
        <div class="space-y-4">
            <div>
                <label for="travel-system-select" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">Destination Star System</label>
                <select id="travel-system-select" name="star_system_id" class="mt-2 block w-full rounded-md border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-200">
                    {% for system in travel_sim_star_systems %}<option value="{{ system.pk }}">{{ system.name }}</option>{% endfor %}
                </select>
            </div>
            <div>
                <label for="speed-percentage" class="block text-xs font-semibold uppercase tracking-wide text-slate-500">Speed (% of Light)</label>
                <input type="number" name="speed_percentage" id="speed-percentage" value="100" min="1" max="100" class="mt-2 block w-full rounded-md border border-slate-200 bg-white px-3 py-2.5 text-sm text-slate-800 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-200">
            </div>
        </div>
        <div class="mt-auto pt-6">
            <button type="submit" class="group/action flex w-full items-center justify-center gap-2 rounded-md bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-black focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                Run Travel Simulation
                <span class="transition-transform duration-200 group-hover/action:translate-x-0.5 motion-reduce:transform-none" aria-hidden="true">→</span>
            </button>
        </div>
    </form>
</article>
