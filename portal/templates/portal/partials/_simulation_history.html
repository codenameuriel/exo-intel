<section id="simulation-history" class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
    <div class="flex flex-col gap-4 border-b border-slate-200 px-4 py-5 sm:px-6 lg:flex-row lg:items-center lg:justify-between">
        <div>
            <p class="exo-mono text-[10px] font-medium uppercase tracking-[0.18em] text-slate-400">Activity Log</p>
            <h2 class="mt-2 text-xl font-semibold text-slate-800 sm:text-2xl">Simulation History</h2>
            <p class="mt-2 max-w-3xl text-sm leading-6 text-slate-600">Track recent simulation jobs, their status, and returned results.</p>
        </div>

        <div class="history-pagination flex items-center gap-2 self-start lg:self-auto">
            <button class="history-prev-btn exo-mono inline-flex h-9 items-center justify-center rounded-md border px-3 text-[10px] font-medium uppercase tracking-[0.12em] transition disabled:cursor-not-allowed">
                &larr; Previous
            </button>
            <span class="history-page-info exo-mono min-w-24 text-center text-[10px] font-medium tracking-wide text-slate-500"></span>
            <button class="history-next-btn exo-mono inline-flex h-9 items-center justify-center rounded-md border px-3 text-[10px] font-medium uppercase tracking-[0.12em] transition disabled:cursor-not-allowed">
                Next &rarr;
            </button>
        </div>
    </div>

    <div class="history-table-wrap overflow-x-auto">
        <table class="history-table min-w-[760px] w-full border-collapse">
            <thead class="bg-slate-50/80">
            <tr class="border-b border-slate-200">
                <th class="exo-mono px-4 py-3 text-left text-[10px] font-medium uppercase tracking-[0.16em] text-slate-500 sm:px-6">Type</th>
                <th class="exo-mono px-4 py-3 text-left text-[10px] font-medium uppercase tracking-[0.16em] text-slate-500 sm:px-6">Status</th>
                <th class="exo-mono px-4 py-3 text-left text-[10px] font-medium uppercase tracking-[0.16em] text-slate-500 sm:px-6">Result</th>
                <th class="exo-mono px-4 py-3 text-left text-[10px] font-medium uppercase tracking-[0.16em] text-slate-500 sm:px-6">Submitted</th>
            </tr>
            </thead>
            <tbody id="history-table-body" class="divide-y divide-slate-100 bg-white">
            <tr>
                <td colspan="4" class="px-6 py-10 text-center text-sm text-slate-500">Loading simulation history...</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="history-pagination flex flex-col gap-3 border-t border-slate-200 bg-slate-50/50 px-4 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
        <button class="history-prev-btn exo-mono inline-flex h-9 items-center justify-center rounded-md border px-3 text-[10px] font-medium uppercase tracking-[0.12em] transition disabled:cursor-not-allowed">
            &larr; Previous
        </button>
        <span class="history-page-info exo-mono text-center text-[10px] font-medium tracking-wide text-slate-500"></span>
        <button class="history-next-btn exo-mono inline-flex h-9 items-center justify-center rounded-md border px-3 text-[10px] font-medium uppercase tracking-[0.12em] transition disabled:cursor-not-allowed">
            Next &rarr;
        </button>
    </div>
</section>
