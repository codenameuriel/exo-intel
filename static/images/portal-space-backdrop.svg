<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Atmospheric deep-space backdrop</title>
  <desc id="desc">A restrained dark space texture with sparse stars and soft cyan atmospheric haze.</desc>
  <defs>
    <radialGradient id="bgGlowA" cx="76%" cy="8%" r="56%">
      <stop offset="0" stop-color="#16354a" stop-opacity=".24"/>
      <stop offset=".26" stop-color="#0a1a2a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#02060d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlowB" cx="58%" cy="26%" r="44%">
      <stop offset="0" stop-color="#144059" stop-opacity=".08"/>
      <stop offset="1" stop-color="#02060d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77dff1" stop-opacity=".06"/>
      <stop offset=".38" stop-color="#2da6c4" stop-opacity=".03"/>
      <stop offset="1" stop-color="#02060d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1100" fill="#02060d"/>
  <rect width="1800" height="1100" fill="url(#bgGlowA)"/>
  <rect width="1800" height="1100" fill="url(#bgGlowB)"/>

  <ellipse cx="1360" cy="172" rx="420" ry="180" fill="url(#mist)" transform="rotate(-11 1360 172)"/>
  <ellipse cx="1180" cy="118" rx="280" ry="100" fill="#7de8f5" opacity=".03" filter="url(#softGlow)"/>
  <ellipse cx="1515" cy="258" rx="340" ry="120" fill="#4bbfd7" opacity=".02" filter="url(#softGlow)" transform="rotate(12 1515 258)"/>

  <g fill="#def7ff" opacity=".38">
    <circle cx="144" cy="118" r="1"/><circle cx="226" cy="302" r=".7"/><circle cx="310" cy="171" r=".6"/>
    <circle cx="391" cy="411" r=".8"/><circle cx="466" cy="85" r=".7"/><circle cx="548" cy="255" r="1"/>
    <circle cx="618" cy="468" r=".6"/><circle cx="694" cy="144" r=".8"/><circle cx="748" cy="344" r=".65"/>
    <circle cx="824" cy="221" r="1"/><circle cx="886" cy="89" r=".7"/><circle cx="946" cy="401" r=".8"/>
    <circle cx="1018" cy="173" r=".65"/><circle cx="1094" cy="309" r=".9"/><circle cx="1164" cy="74" r=".7"/>
    <circle cx="1231" cy="392" r=".75"/><circle cx="1310" cy="190" r=".6"/><circle cx="1388" cy="472" r=".8"/>
    <circle cx="1472" cy="103" r=".7"/><circle cx="1548" cy="338" r=".9"/><circle cx="1668" cy="226" r=".7"/>
    <circle cx="1732" cy="426" r=".65"/><circle cx="92" cy="562" r=".8"/><circle cx="248" cy="714" r=".7"/>
    <circle cx="365" cy="592" r=".65"/><circle cx="518" cy="785" r=".9"/><circle cx="636" cy="634" r=".7"/>
    <circle cx="782" cy="892" r=".65"/><circle cx="932" cy="674" r=".8"/><circle cx="1082" cy="841" r=".6"/>
    <circle cx="1192" cy="566" r=".75"/><circle cx="1358" cy="768" r=".7"/><circle cx="1514" cy="612" r=".65"/>
    <circle cx="1682" cy="824" r=".8"/><circle cx="1724" cy="604" r=".55"/><circle cx="107" cy="944" r=".7"/>
    <circle cx="442" cy="1004" r=".55"/><circle cx="1004" cy="1010" r=".6"/><circle cx="1460" cy="984" r=".65"/>
  </g>

  <g fill="#9beaf6" opacity=".26">
    <circle cx="1180" cy="127" r="1.15"/><circle cx="1518" cy="186" r="1"/><circle cx="1048" cy="486" r=".95"/>
    <circle cx="1591" cy="518" r="1.1"/><circle cx="1296" cy="670" r=".9"/><circle cx="734" cy="543" r=".8"/>
  </g>

  <g fill="#d9fbff" opacity=".55" filter="url(#softGlow)">
    <circle cx="1426" cy="142" r="1.2"/><circle cx="1126" cy="246" r="1.05"/><circle cx="1617" cy="402" r="1.15"/>
  </g>

  <rect width="1800" height="1100" fill="#02060d" opacity=".14"/>
</svg>
