<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Deep-space planetary horizon backdrop</title>
  <desc id="desc">A dark star field with only the immense curved limb of a planet entering from off-canvas at the right, with faint atmospheric bands and restrained cyan glow.</desc>
  <defs>
    <radialGradient id="spaceGlow" cx="82%" cy="12%" r="76%">
      <stop offset="0" stop-color="#0d2a3d" stop-opacity=".34"/>
      <stop offset=".4" stop-color="#061624" stop-opacity=".18"/>
      <stop offset="1" stop-color="#02060d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planetSurface" cx="18%" cy="12%" r="94%">
      <stop offset="0" stop-color="#173746"/>
      <stop offset=".28" stop-color="#0b2230"/>
      <stop offset=".58" stop-color="#06131f"/>
      <stop offset=".82" stop-color="#020811"/>
      <stop offset="1" stop-color="#01040a"/>
    </radialGradient>

    <linearGradient id="atmosphere" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8fbff" stop-opacity=".48"/>
      <stop offset=".24" stop-color="#7cecf8" stop-opacity=".34"/>
      <stop offset=".58" stop-color="#22d3ee" stop-opacity=".15"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cloudBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aeaf4" stop-opacity="0"/>
      <stop offset=".22" stop-color="#9aeaf4" stop-opacity=".05"/>
      <stop offset=".56" stop-color="#d3f8fb" stop-opacity=".075"/>
      <stop offset="1" stop-color="#7bd9e7" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="tinyGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <filter id="bandBlur" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <clipPath id="planetClip">
      <circle cx="1900" cy="650" r="980"/>
    </clipPath>

    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02060d" stop-opacity=".98"/>
      <stop offset=".3" stop-color="#02060d" stop-opacity=".74"/>
      <stop offset=".58" stop-color="#02060d" stop-opacity=".18"/>
      <stop offset="1" stop-color="#02060d" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02060d" stop-opacity="0"/>
      <stop offset=".62" stop-color="#02060d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#02060d" stop-opacity=".96"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1100" fill="#02060d"/>
  <rect width="1800" height="1100" fill="url(#spaceGlow)"/>

  <g fill="#dff8ff" opacity=".42">
    <circle cx="144" cy="118" r="1"/><circle cx="226" cy="302" r=".7"/><circle cx="310" cy="171" r=".6"/>
    <circle cx="391" cy="411" r=".8"/><circle cx="466" cy="85" r=".7"/><circle cx="548" cy="255" r="1"/>
    <circle cx="618" cy="468" r=".6"/><circle cx="694" cy="144" r=".8"/><circle cx="748" cy="344" r=".65"/>
    <circle cx="824" cy="221" r="1"/><circle cx="886" cy="89" r=".7"/><circle cx="946" cy="401" r=".8"/>
    <circle cx="1018" cy="173" r=".65"/><circle cx="1094" cy="309" r=".9"/><circle cx="1164" cy="74" r=".7"/>
    <circle cx="1231" cy="392" r=".75"/><circle cx="1310" cy="190" r=".6"/><circle cx="1388" cy="472" r=".8"/>
    <circle cx="1472" cy="103" r=".7"/><circle cx="1548" cy="338" r=".9"/><circle cx="1668" cy="226" r=".7"/>
    <circle cx="1732" cy="426" r=".65"/><circle cx="92" cy="562" r=".8"/><circle cx="248" cy="714" r=".7"/>
    <circle cx="365" cy="592" r=".65"/><circle cx="518" cy="785" r=".9"/><circle cx="636" cy="634" r=".7"/>
    <circle cx="782" cy="892" r=".65"/><circle cx="932" cy="674" r=".8"/><circle cx="1082" cy="841" r=".6"/>
    <circle cx="1192" cy="566" r=".75"/><circle cx="1358" cy="768" r=".7"/><circle cx="1514" cy="612" r=".65"/>
    <circle cx="1682" cy="824" r=".8"/><circle cx="1724" cy="604" r=".55"/><circle cx="107" cy="944" r=".7"/>
    <circle cx="442" cy="1004" r=".55"/><circle cx="1004" cy="1010" r=".6"/><circle cx="1460" cy="984" r=".65"/>
  </g>

  <g fill="#8be9f6" opacity=".3">
    <circle cx="1180" cy="127" r="1.15"/><circle cx="1518" cy="186" r="1"/><circle cx="1048" cy="486" r=".95"/>
    <circle cx="1591" cy="518" r="1.1"/><circle cx="1296" cy="670" r=".9"/><circle cx="734" cy="543" r=".8"/>
  </g>

  <g fill="#c9fbff" opacity=".62" filter="url(#tinyGlow)">
    <circle cx="1426" cy="142" r="1.3"/><circle cx="1126" cy="246" r="1.1"/><circle cx="1617" cy="402" r="1.2"/>
  </g>

  <!-- Planet is intentionally enormous and mostly off-canvas: only its horizon is visible. -->
  <circle cx="1900" cy="650" r="1014" fill="#36c6df" opacity=".085" filter="url(#softGlow)"/>
  <circle cx="1900" cy="650" r="992" fill="none" stroke="url(#atmosphere)" stroke-width="14" opacity=".58"/>
  <circle cx="1900" cy="650" r="980" fill="url(#planetSurface)"/>

  <g clip-path="url(#planetClip)" opacity=".9">
    <path d="M770 360 C1090 290 1450 315 1795 470 C1990 558 2180 650 2390 720" fill="none" stroke="url(#cloudBand)" stroke-width="34" filter="url(#bandBlur)"/>
    <path d="M720 472 C1050 410 1390 442 1725 590 C1940 684 2150 764 2390 818" fill="none" stroke="url(#cloudBand)" stroke-width="24" filter="url(#bandBlur)" opacity=".72"/>
    <path d="M750 600 C1085 560 1425 606 1750 728 C1970 810 2160 870 2380 902" fill="none" stroke="#7eddea" stroke-opacity=".035" stroke-width="16" filter="url(#bandBlur)"/>
    <ellipse cx="1390" cy="505" rx="360" ry="92" fill="#8bd8e4" opacity=".025" transform="rotate(11 1390 505)"/>
    <ellipse cx="1600" cy="720" rx="430" ry="118" fill="#4b9eb1" opacity=".022" transform="rotate(8 1600 720)"/>
  </g>

  <rect width="1800" height="1100" fill="url(#fadeLeft)"/>
  <rect width="1800" height="1100" fill="url(#fadeBottom)"/>
  <rect width="1800" height="1100" fill="#02060d" opacity=".12"/>
</svg>