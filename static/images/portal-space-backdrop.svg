<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Subtle deep-space backdrop</title>
  <desc id="desc">A dark star field with a softly illuminated planetary limb and restrained cyan atmospheric glow.</desc>
  <defs>
    <radialGradient id="spaceGlow" cx="78%" cy="10%" r="72%">
      <stop offset="0" stop-color="#103149" stop-opacity=".48"/>
      <stop offset=".34" stop-color="#071827" stop-opacity=".28"/>
      <stop offset="1" stop-color="#02060d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="31%" cy="27%" r="76%">
      <stop offset="0" stop-color="#173d50"/>
      <stop offset=".28" stop-color="#0c2534"/>
      <stop offset=".6" stop-color="#06131f"/>
      <stop offset=".84" stop-color="#020711"/>
      <stop offset="1" stop-color="#01030a"/>
    </radialGradient>
    <linearGradient id="atmosphere" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6f4fb" stop-opacity=".44"/>
      <stop offset=".3" stop-color="#67e8f9" stop-opacity=".3"/>
      <stop offset=".66" stop-color="#22d3ee" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="limbLight" cx="18%" cy="18%" r="74%">
      <stop offset="0" stop-color="#8de9f5" stop-opacity=".17"/>
      <stop offset=".38" stop-color="#2c8195" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="tinyGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02060d" stop-opacity=".96"/>
      <stop offset=".34" stop-color="#02060d" stop-opacity=".58"/>
      <stop offset=".62" stop-color="#02060d" stop-opacity=".1"/>
      <stop offset="1" stop-color="#02060d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02060d" stop-opacity="0"/>
      <stop offset=".68" stop-color="#02060d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#02060d" stop-opacity=".96"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1100" fill="#02060d"/>
  <rect width="1800" height="1100" fill="url(#spaceGlow)"/>

  <g fill="#dff8ff" opacity=".46">
    <circle cx="144" cy="118" r="1"/><circle cx="226" cy="302" r=".7"/><circle cx="310" cy="171" r=".6"/>
    <circle cx="391" cy="411" r=".8"/><circle cx="466" cy="85" r=".7"/><circle cx="548" cy="255" r="1"/>
    <circle cx="618" cy="468" r=".6"/><circle cx="694" cy="144" r=".8"/><circle cx="748" cy="344" r=".65"/>
    <circle cx="824" cy="221" r="1"/><circle cx="886" cy="89" r=".7"/><circle cx="946" cy="401" r=".8"/>
    <circle cx="1018" cy="173" r=".65"/><circle cx="1094" cy="309" r=".9"/><circle cx="1164" cy="74" r=".7"/>
    <circle cx="1231" cy="392" r=".75"/><circle cx="1310" cy="190" r=".6"/><circle cx="1388" cy="472" r=".8"/>
    <circle cx="1472" cy="103" r=".7"/><circle cx="1548" cy="338" r=".9"/><circle cx="1668" cy="226" r=".7"/>
    <circle cx="1732" cy="426" r=".65"/><circle cx="92" cy="562" r=".8"/><circle cx="248" cy="714" r=".7"/>
    <circle cx="365" cy="592" r=".65"/><circle cx="518" cy="785" r=".9"/><circle cx="636" cy="634" r=".7"/>
    <circle cx="782" cy="892" r=".65"/><circle cx="932" cy="674" r=".8"/><circle cx="1082" cy="841" r=".6"/>
    <circle cx="1192" cy="566" r=".75"/><circle cx="1358" cy="768" r=".7"/><circle cx="1514" cy="612" r=".65"/>
    <circle cx="1682" cy="824" r=".8"/><circle cx="1724" cy="604" r=".55"/><circle cx="107" cy="944" r=".7"/>
    <circle cx="442" cy="1004" r=".55"/><circle cx="1004" cy="1010" r=".6"/><circle cx="1460" cy="984" r=".65"/>
  </g>

  <g fill="#8be9f6" opacity=".34">
    <circle cx="1180" cy="127" r="1.15"/><circle cx="1518" cy="186" r="1"/><circle cx="1048" cy="486" r=".95"/>
    <circle cx="1591" cy="518" r="1.1"/><circle cx="1296" cy="670" r=".9"/><circle cx="734" cy="543" r=".8"/>
  </g>

  <g fill="#c9fbff" opacity=".7" filter="url(#tinyGlow)">
    <circle cx="1426" cy="142" r="1.3"/><circle cx="1126" cy="246" r="1.1"/><circle cx="1617" cy="402" r="1.2"/>
  </g>

  <g transform="translate(1415 196)">
    <circle cx="0" cy="0" r="456" fill="#36c6df" opacity=".13" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="430" fill="none" stroke="url(#atmosphere)" stroke-width="10" opacity=".64"/>
    <circle cx="0" cy="0" r="420" fill="url(#planet)"/>
    <circle cx="0" cy="0" r="420" fill="url(#limbLight)"/>
    <ellipse cx="-86" cy="-118" rx="286" ry="164" fill="#65d3e5" opacity=".025" transform="rotate(-19)"/>
    <path d="M-318 -196 C-160 -290 105 -286 286 -174" fill="none" stroke="#8aeaf5" stroke-opacity=".035" stroke-width="20"/>
  </g>

  <rect width="1800" height="1100" fill="url(#fadeLeft)"/>
  <rect width="1800" height="1100" fill="url(#fadeBottom)"/>
  <rect width="1800" height="1100" fill="#02060d" opacity=".16"/>
</svg>