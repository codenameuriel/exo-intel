{% extends "rest_framework/base.html" %}

{% load static %}

{% block branding %}
    <a class="navbar-brand" href="{% url 'portal:dashboard' %}" aria-label="ExoIntel Home">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="brand-text">ExoIntel</span>
    </a>
{% endblock %}

{% block userlinks %}
    <div class="navbar-right-flex">
        <div class="user-links">
            {% if user.is_authenticated %}
                <span class="welcome-text" aria-label="Welcome, {{ user.username }}">{{ user.username }}</span>
                <form method="post" action="{% url 'portal:logout' %}" class="logout-form" onsubmit="return confirm('Are you sure you want to log out?');">
                    {% csrf_token %}
                    <button type="submit" class="btn-link logout-link" aria-label="Log out">Log Out</button>
                </form>
            {% else %}
                <a href="{% url 'portal:login' %}" class="login-link" aria-label="Sign in">Login</a>
            {% endif %}
        </div>
    </div>
{% endblock %}

{% block style %}
    {{ block.super }}
    <style>
        :root {
            --brand-primary: #1e293b;
            --brand-primary-hover: #0f172a;
            --brand-bg: #ffffff;
            --brand-border: #e2e8f0;
            --user-bg: #f1f5f9;
            --user-text: #0f172a;
            --focus-ring: 0 0 0 3px rgba(30, 41, 59, 0.3);
            --transition-fast: 0.15s ease;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        .navbar.navbar-static-top.navbar-inverse {
            margin-bottom: 0;
        }

        .navbar-inverse {
            background-color: var(--brand-bg);
            border-bottom: 1px solid var(--brand-border);
        }

        .navbar-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--brand-primary);
            padding: 0.75rem 1rem;
        }

        .brand-icon {
            width: 1.75rem;
            height: 1.75rem;
            flex-shrink: 0;
        }

        .brand-text {
            display: none;
        }

        @media (min-width: 480px) {
            .brand-text {
                display: inline;
            }
        }

        .navbar-brand:focus-visible,
        .logout-link:focus-visible,
        .login-link:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-radius: 0.375rem;
        }

        .navbar-brand:hover {
            color: var(--brand-primary-hover);
        }

        .nav.navbar-nav {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }

        .user-links {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0;
        }

        .welcome-text {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            background: var(--user-bg);
            color: var(--user-text);
            font-weight: 600;
            font-size: 0.875rem;
            line-height: 1.25rem;
            transition: background var(--transition-fast), color var(--transition-fast);
        }

        @media (min-width: 640px) {
            .welcome-text {
                padding: 0.625rem 1rem;
                font-size: 1rem;
                line-height: 1.5rem;
            }
        }

        .logout-link,
        .login-link {
            display: inline-flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--brand-primary);
            text-decoration: none;
            border-radius: 0.375rem;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color var(--transition-fast), background var(--transition-fast);
        }

        .logout-link:hover,
        .login-link:hover {
            color: var(--brand-primary-hover);
            background: var(--user-bg);
            text-decoration: none;
        }

        .logout-form {
            margin: 0;
            padding: 0;
        }

        .logout-form .btn-link {
            padding: 0;
        }

        @media (max-width: 479px) {
            .welcome-text {
                max-width: 120px;
            }
        }
    </style>
{% endblock %}
