<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>404 - Page Not Found | ExoIntel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --brand-primary: #1e293b;
            --brand-primary-hover: #0f172a;
            --brand-bg: #ffffff;
            --brand-border: #e2e8f0;
            --surface-bg: #f8fafc;
            --surface-border: #e2e8f0;
            --user-bg: #f1f5f9;
            --user-text: #0f172a;
            --focus-ring: 0 0 0 3px rgba(30, 41, 59, 0.3);
            --transition-fast: 0.15s ease;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --brand-primary: #e2e8f0;
                --brand-primary-hover: #f1f5f9;
                --brand-bg: #0f172a;
                --brand-border: #334155;
                --surface-bg: #111827;
                --surface-border: #374151;
                --user-bg: #1f2937;
                --user-text: #e5e7eb;
                --focus-ring: 0 0 0 3px rgba(148, 163, 184, 0.4);
            }
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--surface-bg);
            color: var(--brand-primary);
            margin: 0;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            color: var(--brand-bg);
            background-color: var(--brand-primary);
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background-color var(--transition-fast);
        }

        .btn-primary:hover {
            background-color: var(--brand-primary-hover);
        }

        .btn-primary:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-radius: 0.5rem;
        }

        .brand-icon {
            width: 2.5rem;
            height: 2.5rem;
            flex-shrink: 0;
            stroke-width: 2;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="text-center max-w-md">
        <div class="mb-6" aria-hidden="true">
            <svg class="brand-icon mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--brand-primary);">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </div>
        <h1 class="text-7xl md:text-9xl font-bold mb-4" style="color: var(--brand-primary);">404</h1>
        <p class="text-xl md:text-2xl font-light mb-6" style="color: var(--brand-primary); opacity: 0.7;">
            Sorry, the page you are looking for could not be found.
        </p>
        <p class="mb-8" style="color: var(--brand-primary); opacity: 0.5;">
            The resource may have been moved, or you may have a typo in the URL.
        </p>
        <a href="{% url 'portal:dashboard' %}" class="btn-primary mx-auto">
            <svg width="1.25rem" height="1.25rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Go to Dashboard
        </a>
    </div>
</body>
</html>
